
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <style>
        #patientFields, #doctorFields {
            display: none;
        }
    </style>
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h3 class="text-center mb-4">Register</h3>

                        <form id="registerForm" autocomplete="off">

                            <div class="form-group">
                                <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>

                                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

                                <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

                                <select id="role" name="role" class="form-control mb-3">
                                    <option value="">Select Role</option>
                                    <option value="PATIENT">Patient</option>
                                    <option value="DOCTOR">Doctor</option>
                                </select>

                           
                                <div id="patientFields">
                                    <h5 class="mt-3">Patient Details</h5>

                                    <input type="text" name="patient_name" class="form-control mb-2" placeholder="Name">
                                    <input type="number" name="age" class="form-control mb-2" placeholder="Age">
                                    <input type="text" name="bloodgroup" class="form-control mb-2" placeholder="Blood Group">

                                    <select name="patient_gender" class="form-control mb-2">
                                        <option value="">Gender</option>
                                        <option value="MALE">Male</option>
                                        <option value="FEMALE">Female</option>
                                    </select>

                                    <input type="text" name="patient_phone" class="form-control mb-2" placeholder="Phone">
                                    <input type="number" step="0.01" name="height" class="form-control mb-2" placeholder="Height">
                                    <input type="number" step="0.01" name="weight" class="form-control mb-2" placeholder="Weight">
                                    <input type="text" name="city" class="form-control mb-2" placeholder="City">
                                </div>

                      
                                <div id="doctorFields">
                                    <h5 class="mt-3">Doctor Details</h5>

                                    <input type="text" name="doctor_name" class="form-control mb-2" placeholder="Name">
                                    <select id="specialization" name="specialization" class="form-control mb-2" multiple>
                                        <option value="">Select Specialization</option>
                                    </select>
                                    <input type="number" name="experience" class="form-control mb-2" placeholder="Years of Experience">

                                    <select name="doctor_gender" class="form-control mb-2">
                                        <option value="">Gender</option>
                                        <option value="MALE">Male</option>
                                        <option value="FEMALE">Female</option>
                                    </select>

                                    <input type="text" name="doctor_phone" class="form-control mb-2" placeholder="Phone">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block mt-3" >Submit</button>
                           
                            <div class="d-grid">
                            <a href="login.html" class="btn btn-secondary btn-block mt-3">Login</a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center">
    <p id="responseMessage" class="mt-3"></p>
    </div>
    
    <script src='../js/register.js'></script>

</body>
</html>

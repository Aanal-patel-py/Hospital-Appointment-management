<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hospital Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .sidebar { width: 180px; min-height: calc(100vh - 50px); background: #f8f9fa; border-right: 1px solid #dee2e6; }
    .sidebar button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 12px; font-size: 0.9rem; color: #333; }
    .sidebar button:hover { background: #e9ecef; }
    .sidebar button.active { font-weight: 600; color: #0d6efd; background: #e8f0fe; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3 py-2">
  <span class="navbar-brand mb-0 fw-semibold">Hospital Portal</span>
  <div class="ms-auto d-flex align-items-center gap-3">
    <span class="text-white-50 small" id="navbar-username"></span>
    <span class="badge bg-light text-primary" id="navbar-role"></span>
    <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="d-flex">

  <!-- SIDEBAR -->
  <div class="sidebar pt-3 px-2" id="sidebar">
    <div id="doctor-nav" class="d-none">
      <button onclick="loadProfile(this)">Profile</button>
      <button onclick="showSchedulePage(this)"> Schedule</button>
      
      <button onclick="loadAppointments(this)">Appointments</button>
    </div>
    <div id="patient-nav" class="d-none">
      <button onclick="loadProfile(this)">Profile</button>
      <button onclick="loadDoctors(this)">Book Appointment</button>
      <button onclick="loadAppointments(this)">My Appointments</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="flex-grow-1 p-4">
    <div id="message-area" class="d-none mb-3"></div>
    <div id="loading" class="d-none text-muted small">Loading…</div>
    <div id="content-area">
      <p class="text-muted">Select an option from the sidebar.</p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>

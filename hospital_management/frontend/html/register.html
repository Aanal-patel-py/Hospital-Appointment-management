
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <style>
        #patientFields, #doctorFields {
            display: none;
        }
    </style>
</head>

<body>
    <h1 style="display: flex; justify-content: center;"> Register</h1>
<div style="display: flex; justify-content: center; padding-top: 30px;">
<form id="registerForm" autocomplete="off">
    
    <div class="form-group">

    <input type="text" name="username" placeholder="Username" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <input type="email" name="email" placeholder="Email" required><br><br>

    <select id="role" name="role">
        <option value="">Select Role</option>
        <option value="PATIENT">Patient</option>
        <option value="DOCTOR">Doctor</option>
    </select><br><br>

    <!-- Patient Fields -->
    <div id="patientFields">
        <h3>Patient Details</h3>

        <input type="text" name="patient_name" placeholder="Name"><br><br>
        <input type="number" name="age" placeholder="Age"><br><br>
        <input type="text" name="bloodgroup" placeholder="Blood Group"><br><br>

        <select name="patient_gender">
            <option value="">Gender</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
        </select><br><br>

        <input type="text" name="patient_phone" placeholder="Phone"><br><br>
        <input type="number" step="0.01" name="height" placeholder="Height"><br><br>
        <input type="number" step="0.01" name="weight" placeholder="Weight"><br><br>
        <input type="text" name="city" placeholder="City"><br><br>
    </div>
   

    
    <div id="doctorFields">
        <h3>Doctor Details</h3>

        <input type="text" name="doctor_name" placeholder="Name"><br><br>
        <input type="text" name="specialization" placeholder="Specialization"><br><br>
        <input type="number" name="experience" placeholder="Years of Experience"><br><br>

        <select name="doctor_gender">
            <option value="">Gender</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
        </select><br><br>

        <input type="text" name="doctor_phone" placeholder="Phone"><br><br>
    </div>
     </div>

    <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>

<p id="responseMessage"></p>

<script src="../js/script.js"></script>

</body>
</html>
